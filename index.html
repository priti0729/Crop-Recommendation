<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4caf50;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            text-align: center;
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 12px;
        }

        .result h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .crop-name {
            font-size: 28px;
            font-weight: bold;
            color: #1b5e20;
            text-transform: capitalize;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌱 Crop Recommendation System</h1>

    <p class="subtitle">
        Enter soil and environmental conditions to get a suitable crop recommendation.
    </p>

    <form id="cropForm">

        <div class="form-grid">

            <div class="input-box">
                <label>Nitrogen (N)</label>
                <input type="number" step="any" id="nitrogen" required
                       placeholder="Enter Nitrogen">
            </div>

            <div class="input-box">
                <label>Phosphorus (P)</label>
                <input type="number" step="any" id="phosphorus" required
                       placeholder="Enter Phosphorus">
            </div>

            <div class="input-box">
                <label>Potassium (K)</label>
                <input type="number" step="any" id="potassium" required
                       placeholder="Enter Potassium">
            </div>

            <div class="input-box">
                <label>Temperature (°C)</label>
                <input type="number" step="any" id="temperature" required
                       placeholder="Enter Temperature">
            </div>

            <div class="input-box">
                <label>Humidity (%)</label>
                <input type="number" step="any" id="humidity" required
                       placeholder="Enter Humidity">
            </div>

            <div class="input-box">
                <label>pH Value</label>
                <input type="number" step="any" id="ph" required
                       placeholder="Enter pH">
            </div>

            <div class="input-box">
                <label>Rainfall (mm)</label>
                <input type="number" step="any" id="rainfall" required
                       placeholder="Enter Rainfall">
            </div>

        </div>

        <button type="submit">
            🌾 Recommend Crop
        </button>

    </form>

    <div class="result" id="resultBox">
        <h2>Recommended Crop</h2>
        <div class="crop-name" id="cropResult"></div>
    </div>

    <div class="error" id="errorBox">
        Something went wrong. Please check the entered values.
    </div>

</div>

<!-- Random Forest JavaScript Model -->
<script src="crop_model.js"></script>

<script>

    document.getElementById("cropForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const nitrogen = parseFloat(document.getElementById("nitrogen").value);
        const phosphorus = parseFloat(document.getElementById("phosphorus").value);
        const potassium = parseFloat(document.getElementById("potassium").value);
        const temperature = parseFloat(document.getElementById("temperature").value);
        const humidity = parseFloat(document.getElementById("humidity").value);
        const ph = parseFloat(document.getElementById("ph").value);
        const rainfall = parseFloat(document.getElementById("rainfall").value);

        const input = [
            nitrogen,
            phosphorus,
            potassium,
            temperature,
            humidity,
            ph,
            rainfall
        ];

        try {

            const crop = recommendCrop(input);

            document.getElementById("cropResult").textContent = crop;

            document.getElementById("resultBox").style.display = "block";

            document.getElementById("errorBox").style.display = "none";

        } catch (error) {

            console.error(error);

            document.getElementById("resultBox").style.display = "none";

            document.getElementById("errorBox").style.display = "block";
        }

    });

</script>

</body>
</html>
